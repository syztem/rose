<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Glass Red Rose in Rain — three.js r186</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #0b100e;
      overscroll-behavior: none;
      touch-action: none; /* F17: canvas parent — no browser pan/zoom steal */
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    /* F17: HUD / FPS / err clear of notch & home indicator */
    #hud {
      position: fixed;
      left: calc(12px + env(safe-area-inset-left, 0px));
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 2;
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(220, 232, 226, 0.72); pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
      padding-right: env(safe-area-inset-right, 0px);
    }
    #hud b { color: rgba(255,210,210,.9); font-weight: 600; }
    #fps {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top, 0px));
      right: calc(10px + env(safe-area-inset-right, 0px));
      z-index: 2; pointer-events: none;
      font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(220, 232, 226, 0.55);
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
    }
    #err {
      position: fixed; inset: 0; display: none; place-items: center;
      padding:
        calc(24px + env(safe-area-inset-top, 0px))
        calc(24px + env(safe-area-inset-right, 0px))
        calc(24px + env(safe-area-inset-bottom, 0px))
        calc(24px + env(safe-area-inset-left, 0px));
      background: #0b100e; color: #f0d0d0;
      font: 14px/1.5 system-ui, sans-serif; z-index: 9; white-space: pre-wrap;
    }
  </style>
  <!--
    GitHub Pages static deploy:
    - Pin three@0.186.0 on jsDelivr (verified 200s for webgpu/tsl/addons).
    - All local modules/assets are relative (works on user OR project pages).
    - .nojekyll prevents Jekyll from hiding folders like src/ or files with leading underscores.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">ruby glass · r186 webgpu · drag to orbit · <b>?debug=1</b></div>
  <div id="err"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
